# Baseado no docker-compose.yml oficial do Judge0
# (https://github.com/judge0/judge0), imagem fixada em 1.13.1 — a versão
# estável mais recente no Docker Hub no momento em que isso foi escrito
# (a tag "latest" aponta pra essa mesma versão; fixamos o número pra não
# tomar um upgrade silencioso de imagem no meio do semestre).
#
# Requisito conhecido: o Judge0 usa `isolate` como sandbox, que ainda
# depende de cgroup v1 (ou hybrid). Kernels modernos com cgroup v2 puro
# (padrão em Ubuntu 21.10+ e derivados) fazem o `server`/`worker` falharem
# ao tentar rodar código. Veja judge0/README.md antes de subir isso.
x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
